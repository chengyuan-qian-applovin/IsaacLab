<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" width="1140" height="640" role="img"
     aria-label="TACO teleop architecture: the Apple Vision Pro client streams hand and head poses and control commands through the CloudXR Runtime container to the Isaac Lab container, whose teleop loop retargets the poses into a 58-dimensional robot action, steps physics, renders stereo frames back to the headset, and records episodes to HDF5 for offline replay.">
  <style>
    text { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
    .lane-t  { font-size: 13px; font-weight: 600; fill: #1d2b36; }
    .lane-s  { font-size: 10.5px; fill: #5a6b78; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; }
    .box-t   { font-size: 12px; font-weight: 600; fill: #1d2b36; }
    .box-m   { font-size: 10px; fill: #5a6b78; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; }
    .box-l   { font-size: 10.5px; fill: #1d2b36; }
    .flow-d  { font-size: 10.5px; fill: #0e7c86; }
    .flow-c  { font-size: 10.5px; fill: #b25c00; }
    .tiny-d  { font-size: 9.5px; fill: #0e7c86; }
    .tiny-c  { font-size: 9.5px; fill: #b25c00; }
    .leg     { font-size: 11px; fill: #5a6b78; }
  </style>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b25c00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="640" fill="#ffffff"/>

  <!-- ===== Lane containers ===== -->
  <rect x="20"  y="50" width="230" height="420" rx="10" fill="#eceff1" stroke="#a9b8c1"/>
  <text x="135" y="76" text-anchor="middle" class="lane-t">Apple Vision Pro</text>
  <text x="135" y="92" text-anchor="middle" class="lane-s">visionOS client app</text>

  <rect x="400" y="50" width="170" height="420" rx="10" fill="#eceff1" stroke="#a9b8c1"/>
  <text x="485" y="76" text-anchor="middle" class="lane-t">CloudXR Runtime</text>
  <text x="485" y="92" text-anchor="middle" class="lane-s">5.0.1 &#183; docker</text>
  <text x="485" y="248" text-anchor="middle" class="box-l">bridges headset &amp; sim:</text>
  <text x="485" y="264" text-anchor="middle" class="box-l">video encode, pose and</text>
  <text x="485" y="280" text-anchor="middle" class="box-l">message transport</text>
  <text x="485" y="300" text-anchor="middle" class="box-m">Wi-Fi &#8596; OpenXR</text>

  <rect x="690" y="20" width="430" height="600" rx="10" fill="#eceff1" stroke="#a9b8c1"/>
  <text x="905" y="46" text-anchor="middle" class="lane-t">Isaac Lab &#183; isaac-lab-base docker</text>
  <text x="905" y="62" text-anchor="middle" class="lane-s">teleop_taco_scene.py</text>

  <!-- ===== AVP sub-boxes ===== -->
  <rect x="36" y="104" width="198" height="124" rx="7" fill="#ffffff" stroke="#a9b8c1"/>
  <text x="135" y="126" text-anchor="middle" class="box-t">CloudXRKit 5.0.1</text>
  <text x="135" y="146" text-anchor="middle" class="box-l">hand + head tracking</text>
  <text x="135" y="162" text-anchor="middle" class="box-l">26 joints per hand</text>
  <text x="135" y="182" text-anchor="middle" class="box-l">stereo decode &amp; display</text>
  <text x="135" y="198" text-anchor="middle" class="box-l">90 Hz</text>

  <rect x="36" y="266" width="198" height="178" rx="7" fill="#ffffff" stroke="#a9b8c1"/>
  <text x="135" y="290" text-anchor="middle" class="box-t">Teleop UI (SwiftUI)</text>
  <text x="135" y="312" text-anchor="middle" class="box-l">Play &#183; Stop &#183; Reset &#183; Align</text>
  <text x="135" y="334" text-anchor="middle" class="box-l">Success / Failure sheet</text>
  <text x="135" y="350" text-anchor="middle" class="box-l">(server-initiated)</text>
  <text x="135" y="372" text-anchor="middle" class="box-l">auto Stop + Reset</text>
  <text x="135" y="388" text-anchor="middle" class="box-l">after each episode</text>

  <!-- ===== AVP <-> Runtime flows ===== -->
  <text x="325" y="128" text-anchor="middle" class="flow-d">hand + head poses</text>
  <text x="325" y="141" text-anchor="middle" class="tiny-d">&#8804; 90 Hz</text>
  <line x1="250" y1="150" x2="396" y2="150" stroke="#0e7c86" stroke-width="1.6" marker-end="url(#ad)"/>

  <text x="325" y="186" text-anchor="middle" class="flow-d">stereo video &#183; 90 Hz</text>
  <line x1="404" y1="205" x2="254" y2="205" stroke="#0e7c86" stroke-width="1.6" marker-end="url(#ad)"/>

  <text x="325" y="302" text-anchor="middle" class="flow-c">teleop_command (JSON)</text>
  <line x1="250" y1="320" x2="396" y2="320" stroke="#b25c00" stroke-width="1.6" marker-end="url(#ac)"/>

  <text x="325" y="372" text-anchor="middle" class="flow-c">S/F dialog request</text>
  <line x1="404" y1="390" x2="254" y2="390" stroke="#b25c00" stroke-width="1.6" marker-end="url(#ac)"/>

  <!-- ===== Runtime <-> Isaac flows ===== -->
  <text x="630" y="128" text-anchor="middle" class="flow-d">joint poses</text>
  <text x="630" y="141" text-anchor="middle" class="tiny-d">via OpenXR</text>
  <line x1="570" y1="150" x2="702" y2="150" stroke="#0e7c86" stroke-width="1.6" marker-end="url(#ad)"/>

  <text x="630" y="172" text-anchor="middle" class="tiny-c">commands</text>
  <line x1="570" y1="181" x2="702" y2="181" stroke="#b25c00" stroke-width="1.4" marker-end="url(#ac)"/>
  <line x1="706" y1="199" x2="574" y2="199" stroke="#b25c00" stroke-width="1.4" marker-end="url(#ac)"/>
  <text x="630" y="216" text-anchor="middle" class="tiny-c">send_message relay</text>

  <text x="630" y="374" text-anchor="middle" class="flow-d">stereo frames &#183; 30 Hz</text>
  <line x1="706" y1="388" x2="574" y2="388" stroke="#0e7c86" stroke-width="1.6" marker-end="url(#ad)"/>

  <!-- ===== Isaac: XR input ===== -->
  <rect x="706" y="84" width="200" height="124" rx="7" fill="#ffffff" stroke="#a9b8c1"/>
  <text x="806" y="106" text-anchor="middle" class="box-t">XR input &amp; retargeting</text>
  <text x="806" y="122" text-anchor="middle" class="box-m">OpenXRDevice &#183; XRCore</text>
  <text x="806" y="142" text-anchor="middle" class="box-l">26 joints &#215; 2 hands + head</text>
  <text x="806" y="158" text-anchor="middle" class="box-l">wrist offsets + DexPilot</text>
  <text x="806" y="174" text-anchor="middle" class="box-l">fingers &#183; RawXrCapture</text>
  <text x="806" y="190" text-anchor="middle" class="box-l">(raw feed for gesture)</text>

  <!-- ===== Isaac: session control ===== -->
  <rect x="952" y="84" width="152" height="124" rx="7" fill="#ffffff" stroke="#a9b8c1"/>
  <text x="1028" y="106" text-anchor="middle" class="box-t">Session control</text>
  <text x="1028" y="122" text-anchor="middle" class="box-m">TeleopCommandBridge</text>
  <text x="1028" y="142" text-anchor="middle" class="box-l">stop gesture &#183; aligner</text>
  <text x="1028" y="158" text-anchor="middle" class="box-l">Play &#183; Stop &#183; Reset &#183; Align</text>
  <text x="1028" y="174" text-anchor="middle" class="box-l">S/F dialog + result,</text>
  <text x="1028" y="190" text-anchor="middle" class="box-l">episode export trigger</text>

  <text x="929" y="126" text-anchor="middle" class="tiny-c">cmds</text>
  <line x1="906" y1="134" x2="948" y2="134" stroke="#b25c00" stroke-width="1.4" marker-end="url(#ac)"/>
  <line x1="952" y1="164" x2="910" y2="164" stroke="#b25c00" stroke-width="1.4" marker-end="url(#ac)"/>
  <text x="929" y="180" text-anchor="middle" class="tiny-c">dialog</text>

  <!-- ===== Isaac: teleop loop ===== -->
  <line x1="806" y1="208" x2="806" y2="256" stroke="#0e7c86" stroke-width="1.6" marker-end="url(#ad)"/>
  <text x="816" y="238" class="tiny-d">hands + head</text>

  <rect x="706" y="260" width="200" height="150" rx="7" fill="#ffffff" stroke="#a9b8c1"/>
  <text x="806" y="282" text-anchor="middle" class="box-t">Teleop loop &#183; 60 Hz</text>
  <text x="806" y="300" text-anchor="middle" class="box-m">to_root_frame &#8594; 58-D</text>
  <text x="806" y="320" text-anchor="middle" class="box-l">DiffIK arms + PD fingers</text>
  <text x="806" y="336" text-anchor="middle" class="box-l">PhysX 240 Hz &#183; tip-only</text>
  <text x="806" y="352" text-anchor="middle" class="box-l">self-collision</text>
  <line x1="722" y1="366" x2="890" y2="366" stroke="#eceff1" stroke-width="1.5"/>
  <text x="806" y="386" text-anchor="middle" class="box-m">sim.render &#183; 30 Hz</text>

  <polyline points="1028,208 1028,335 910,335" fill="none" stroke="#b25c00" stroke-width="1.4" marker-end="url(#ac)"/>
  <text x="1036" y="252" class="tiny-c">start / stop /</text>
  <text x="1036" y="265" class="tiny-c">reset &#183; align</text>

  <!-- ===== Isaac: recorder + dataset ===== -->
  <line x1="806" y1="410" x2="806" y2="450" stroke="#0e7c86" stroke-width="1.6" marker-end="url(#ad)"/>
  <text x="816" y="434" class="tiny-d">joint states + object poses</text>

  <rect x="706" y="454" width="200" height="64" rx="7" fill="#ffffff" stroke="#a9b8c1"/>
  <text x="806" y="478" text-anchor="middle" class="box-t">RecorderManager</text>
  <text x="806" y="498" text-anchor="middle" class="box-l">60 Hz &#183; one demo / episode</text>

  <rect x="952" y="454" width="152" height="64" rx="7" fill="#ffffff" stroke="#a9b8c1"/>
  <text x="1028" y="482" text-anchor="middle" class="box-m">dataset_*.hdf5</text>
  <text x="1028" y="500" text-anchor="middle" class="box-l">success attr / demo</text>

  <text x="929" y="470" text-anchor="middle" class="tiny-d">export</text>
  <line x1="906" y1="486" x2="948" y2="486" stroke="#0e7c86" stroke-width="1.6" marker-end="url(#ad)"/>

  <line x1="1028" y1="518" x2="1028" y2="550" stroke="#0e7c86" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ad)"/>
  <text x="905" y="574" text-anchor="middle" class="box-m">offline: replay_taco_scene.py &#8212; kinematic replay &#183; 4 cameras &#183; DR grid</text>

  <!-- ===== Legend ===== -->
  <line x1="24" y1="556" x2="60" y2="556" stroke="#0e7c86" stroke-width="1.6" marker-end="url(#ad)"/>
  <text x="68" y="560" class="leg">data plane &#8212; poses, video, robot state</text>
  <line x1="24" y1="582" x2="60" y2="582" stroke="#b25c00" stroke-width="1.6" marker-end="url(#ac)"/>
  <text x="68" y="586" class="leg">control plane &#8212; commands, dialog, episode marks</text>
</svg>
